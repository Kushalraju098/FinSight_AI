[project]
name = "finsight-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kushalraju098", email = "kushalraju098@gmailKushalraju098.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain[mcp]>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "lxml>=6.1.3",
    "pandas>=3.0.5",
    "pinecone>=10.0.0",
    "sentence-transformers>=6.0.1",
    "tabulate>=0.10.0",
    "tqdm>=4.70.1",
    "fastmcp>=4.0.10",
    "yfinance>=1.7.0",
    "feedparser>=6.0.14",
    "langchain-google-genai>=4.4.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "transformers>=5.17.0",
    "fastapi[standard]>=0.143.0",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
finsight-ai = "finsight_ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
